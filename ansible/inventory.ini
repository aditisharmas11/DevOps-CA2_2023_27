# =============================================================================
# Ansible Inventory File
# Defines target hosts for the Student Management System deployment
# =============================================================================

[webservers]
web1 ansible_host=192.168.1.101 ansible_user=deploy
web2 ansible_host=192.168.1.102 ansible_user=deploy

[monitoring]
monitor1 ansible_host=192.168.1.110 ansible_user=deploy

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_rsa
app_user=studentapp
app_group=studentapp
app_port=5000
app_home=/opt/student-api
docker_image=ghcr.io/student-management/student-api:latest
