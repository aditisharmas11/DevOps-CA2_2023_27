# =============================================================================
# Ansible Playbook - Configure Runtime Environment
# Student Management System
# =============================================================================
# This playbook:
#   1. Installs required system packages (Docker, Python, curl, etc.)
#   2. Creates a dedicated application user and group
#   3. Sets up application directories with correct permissions
#   4. Manages configuration files (environment variables, systemd service)
#   5. Deploys and starts the application container
# =============================================================================

---
- name: Configure Runtime Environment for Student Management System
  hosts: webservers
  become: yes
  vars:
    app_user: studentapp
    app_group: studentapp
    app_home: /opt/student-api
    app_port: 5000
    docker_image: "ghcr.io/student-management/student-api:latest"
    packages:
      - docker.io
      - docker-compose
      - python3
      - python3-pip
      - curl
      - wget
      - git
      - ufw
      - htop
      - net-tools

  tasks:
    # ─────────────────────────────────────────────────────────────────────
    # 1. System Update & Package Installation
    # ─────────────────────────────────────────────────────────────────────
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: [packages]

    - name: Install required packages
      apt:
        name: "{{ packages }}"
        state: present
      tags: [packages]

    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes
      tags: [docker]

    # ─────────────────────────────────────────────────────────────────────
    # 2. User & Group Management
    # ─────────────────────────────────────────────────────────────────────
    - name: Create application group
      group:
        name: "{{ app_group }}"
        state: present
      tags: [users]

    - name: Create application user
      user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        home: "{{ app_home }}"
        shell: /bin/bash
        system: yes
        create_home: yes
        comment: "Student API Service Account"
      tags: [users]

    - name: Add app user to docker group
      user:
        name: "{{ app_user }}"
        groups: docker
        append: yes
      tags: [users]

    # ─────────────────────────────────────────────────────────────────────
    # 3. Directory Structure Setup
    # ─────────────────────────────────────────────────────────────────────
    - name: Create application directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"
      loop:
        - "{{ app_home }}"
        - "{{ app_home }}/config"
        - "{{ app_home }}/logs"
        - "{{ app_home }}/data"
      tags: [directories]

    # ─────────────────────────────────────────────────────────────────────
    # 4. Configuration File Management
    # ─────────────────────────────────────────────────────────────────────
    - name: Deploy environment configuration file
      copy:
        dest: "{{ app_home }}/config/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0600"
        content: |
          # Student API Configuration
          PORT={{ app_port }}
          APP_VERSION=1.0.0
          FLASK_ENV=production
          LOG_LEVEL=INFO
          WORKERS=2
      notify: Restart student-api
      tags: [config]

    - name: Deploy systemd service file
      copy:
        dest: /etc/systemd/system/student-api.service
        mode: "0644"
        content: |
          [Unit]
          Description=Student Management API Service
          After=docker.service network-online.target
          Requires=docker.service

          [Service]
          Type=simple
          User={{ app_user }}
          Group={{ app_group }}
          WorkingDirectory={{ app_home }}
          ExecStartPre=/usr/bin/docker pull {{ docker_image }}
          ExecStart=/usr/bin/docker run --rm \
            --name student-api \
            --env-file {{ app_home }}/config/.env \
            -p {{ app_port }}:5000 \
            {{ docker_image }}
          ExecStop=/usr/bin/docker stop student-api
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
      notify: Restart student-api
      tags: [service]

    - name: Deploy logrotate configuration
      copy:
        dest: /etc/logrotate.d/student-api
        mode: "0644"
        content: |
          {{ app_home }}/logs/*.log {
              daily
              missingok
              rotate 14
              compress
              delaycompress
              notifempty
              copytruncate
          }
      tags: [config]

    # ─────────────────────────────────────────────────────────────────────
    # 5. Firewall Configuration
    # ─────────────────────────────────────────────────────────────────────
    - name: Enable UFW firewall
      ufw:
        state: enabled
        policy: deny
      tags: [firewall]

    - name: Allow SSH
      ufw:
        rule: allow
        port: "22"
        proto: tcp
      tags: [firewall]

    - name: Allow application port
      ufw:
        rule: allow
        port: "{{ app_port }}"
        proto: tcp
      tags: [firewall]

    # ─────────────────────────────────────────────────────────────────────
    # 6. Start the Application
    # ─────────────────────────────────────────────────────────────────────
    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      tags: [service]

    - name: Enable and start student-api service
      systemd:
        name: student-api
        state: started
        enabled: yes
      tags: [service]

  # ─────────────────────────────────────────────────────────────────────────
  # Handlers
  # ─────────────────────────────────────────────────────────────────────────
  handlers:
    - name: Restart student-api
      systemd:
        name: student-api
        state: restarted
        daemon_reload: yes
