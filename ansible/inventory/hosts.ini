# Target servers (Ubuntu 22.04 / 24.04). Replace the IP and user with your VM's.
#   ansible-playbook site.yml                 # uses this inventory (see ansible.cfg)
#   ansible-playbook -i inventory/local.ini site.yml   # configure the machine you are on

[app_servers]
airline-vm-1 ansible_host=192.168.56.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
