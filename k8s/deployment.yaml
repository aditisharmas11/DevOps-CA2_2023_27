# =============================================================================
# Kubernetes Deployment - Student Management API
# Supports rolling updates & rollback
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-api
  namespace: student-app
  labels:
    app: student-api
    version: v1
  annotations:
    kubernetes.io/change-cause: "Initial deployment v1.0.0"
spec:
  replicas: 3
  revisionHistoryLimit: 5          # Keep 5 revisions for rollback
  selector:
    matchLabels:
      app: student-api
  # ── Rolling Update Strategy ───────────────────────────────────────────
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                  # Allow 1 extra pod during update
      maxUnavailable: 0            # Zero downtime - no pod removed until new one is ready
  template:
    metadata:
      labels:
        app: student-api
        version: v1
    spec:
      containers:
        - name: student-api
          image: ghcr.io/student-management/student-api:1.0.0
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: PORT
              value: "5000"
            - name: APP_VERSION
              value: "1.0.0"
            - name: FLASK_ENV
              value: "production"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # ── Health Checks ─────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
