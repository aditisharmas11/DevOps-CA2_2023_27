# =============================================================================
# Kubernetes Service - Student Management API
# Exposes the deployment within the cluster and optionally externally
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: student-api-service
  namespace: student-app
  labels:
    app: student-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "5000"
    prometheus.io/path: "/metrics"
spec:
  type: LoadBalancer
  selector:
    app: student-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
