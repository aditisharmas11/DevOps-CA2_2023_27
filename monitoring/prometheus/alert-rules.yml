groups:
  - name: airline-api
    rules:
      - alert: AirlineApiDown
        expr: up{job="airline-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "airline-api instance {{ $labels.instance }} is down"

      - alert: AirlineApiHighErrorRate
        expr: |
          sum(rate(airline_api_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(airline_api_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are failing with 5xx ({{ $value | humanizePercentage }})"

      - alert: AirlineApiHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(airline_api_http_request_duration_seconds_bucket{path="/predict"}[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 /predict latency is above 500 ms ({{ $value | humanizeDuration }})"

      - alert: AirlineApiModelNotLoaded
        expr: airline_api_model_loaded == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is running without a model"
