# =============================================================================
# Prometheus Alert Rules
# =============================================================================

groups:
  - name: student-api-alerts
    rules:
      # Alert when any instance is down for > 1 minute
      - alert: InstanceDown
        expr: up{job="student-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Student API instance {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} has been down for more than 1 minute."

      # Alert when error rate > 5%
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_errors_total{job="student-api"}[5m]))
            /
            sum(rate(http_requests_total{job="student-api"}[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on Student API"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # Alert when p95 latency > 500ms
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="student-api"}[5m])) by (le))
          > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High latency on Student API"
          description: "P95 latency is {{ $value }}s (threshold: 500ms)"
