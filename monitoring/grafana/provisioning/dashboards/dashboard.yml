# =============================================================================
# Grafana Dashboard Auto-Provisioning
# =============================================================================

apiVersion: 1

providers:
  - name: "default"
    orgId: 1
    folder: "Student API"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
