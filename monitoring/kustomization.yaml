# Prometheus + Grafana on Kubernetes:  kubectl apply -k monitoring/
# Prometheus -> NodePort 30090, Grafana -> NodePort 30300
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - k8s/namespace.yaml
  - k8s/prometheus.yaml
  - k8s/grafana.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus/prometheus-k8s.yml
      - alert-rules.yml=prometheus/alert-rules.yml
  - name: grafana-datasources
    files:
      - datasource.yml=grafana/provisioning/datasources/datasource.yml
  - name: grafana-dashboard-provider
    files:
      - provider.yml=grafana/provisioning/dashboards/provider.yml
  - name: grafana-dashboards
    files:
      - airline-api.json=grafana/dashboards/airline-api.json
